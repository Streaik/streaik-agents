
name: Agents CI and Azure deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout agents
        uses: actions/checkout@v4
        with:
          path: streaik-agents

      - name: Checkout Responses
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-responses
          path: streaik-responses

      - name: Checkout Vercel
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-vercel
          path: streaik-vercel

      - name: Checkout Tools
        uses: actions/checkout@v4
        with:
          repository: Streaik/streaik-tools
          path: streaik-tools

      - name: Setup .NET 11
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'

      - name: Test agents
        working-directory: streaik-agents
        run: dotnet test tests/Streaik.Agents.Tests/Streaik.Agents.Tests.csproj -c Release

      - name: Publish agents HeaderAuth
        working-directory: streaik-agents
        run: |
          dotnet publish samples/Streaik.Agents.HeaderAuth/Streaik.Agents.HeaderAuth.csproj \
            -c Release \
            -r win-x64 \
            --self-contained true \
            -o artifacts/publish

      - name: Upload agents package
        uses: actions/upload-artifact@v4
        with:
          name: streaik-agents-win-x64
          path: streaik-agents/artifacts/publish/
          if-no-files-found: error
          retention-days: 14

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build-test-publish
    runs-on: ubuntu-latest
    environment: streaik-production

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download agents package
        uses: actions/download-artifact@v4
        with:
          name: streaik-agents-win-x64
          path: ./publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy Azure Windows App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: ./publish
